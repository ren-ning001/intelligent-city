- insert:
    - id: zyourroad-osm-mcp
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: zyourroad
        transport: stdio
        command: !!js process.env.ZYOURROAD_PYTHON || 'python'
        args: ['-m', 'backend.app.mcp_server']
        cwd: !!js process.env.ZYOURROAD_ROOT || process.cwd()
        toolCallTimeoutMs: 180000
        startupTimeoutMs: 30000
        closeTimeoutMs: 5000
        failOnStartupError: true
        reconnect:
          enabled: true
          initialDelayMs: 500
          maxDelayMs: 10000
          maxAttempts: 5

- id: sessions
  name: '@deepseek-ai/dsh-session-persistence-jsonl'
  config:
    root: !!js process.env.ZYOURROAD_SESSION_ROOT
    compression: none

# The bundled Windows runtime otherwise resolves pwsh to a bare PATH entry that
# the managed subprocess environment may not see. Pin the absolute executable
# chosen by the backend so the persistent PTY can start.
- id: terminal-pwsh
  config:
    shellDialect: pwsh
    shellPath: !!js process.env.ZYOURROAD_PWSH_PATH
    timeoutMs: 300000
